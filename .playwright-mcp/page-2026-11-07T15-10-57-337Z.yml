    - region "Why it is called GroundSet" [ref=e79]:
      - generic [ref=e80]:
        - generic:
          - generic:
            - heading "Ground + Set" [level=3]
            - paragraph: One word, assembled from two.
            - paragraph: "Ground is what a decision stands on: the evidence in front of you and the rules you wrote. Set is what happens to it next: fixed in the record, where it can be replayed."
        - generic [aria-hidden]:
          - generic:
            - heading [level=3]: Three parts
            - paragraph: Each one carries part of what GroundSet™ does.
            - paragraph: "Take the mark apart and there are three pieces: a ground, a point with every possible decision above it, and an arc. None of them is decoration."
        - generic [aria-hidden]:
          - generic:
            - heading [level=3]: Ground
            - paragraph: Evidence and rules.
            - paragraph: Evidence · Rules · Deterministic
            - paragraph: "Every judgement starts grounded. Real-world evidence is read as it arrives, and your rules are applied deterministically: the same evidence and the same rule version give the same outcome."
        - generic [aria-hidden]:
          - generic:
            - heading [level=3]: Set
            - paragraph: Every possible decision, brought to one.
            - paragraph: Decided · Set · Replayable
            - paragraph: The dots above the point are every decision that could be made. Your evidence and your rules bring them to one. That one does not float. It rests on the ground that produced it, and it is set in the decision ledger with its evidence, its rule version and any human override.
        - generic [aria-hidden]:
          - generic:
            - heading [level=3]: Sovereign
            - paragraph: Yours, and drawn open.
            - paragraph: Sovereign · Open · Yours
            - paragraph: "The arc is your environment. GroundSet™ runs inside it, on models you own. It is never drawn closed: a system of record for judgement cannot be a black box, so every decision can be opened and replayed."
        - generic [aria-hidden]:
          - generic:
