            - paragraph [ref=e241]: Human judgement - who approved this loan, on what evidence, under which rule, and why - was never recorded anywhere. It lived in people's heads and died in email threads.
            - paragraph [ref=e242]: "It doesn't scale, either. Every new decision workflow means more headcount, more training, more inconsistency. And the rules engines built to help cannot read the evidence real decisions actually run on: handwritten ledgers, crumpled receipts, scanned IDs, voice logs, camera feeds."
